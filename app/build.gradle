apply from: "../commons-device.gradle"

/* gets the version name from the latest Git tag, stripping the leading v off */
def getVersionName = { ->
    return providers.exec {
        commandLine 'git', 'describe', '--tags', '--always'
    }.standardOutput.asText.get().trim()
}

static def versionCodeEpoch() {
    return (new Date().getTime() / 1000).toInteger()
}

android {
    defaultConfig {
        applicationId "io.anyone.anyonevpn"
        versionName getVersionName()
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        base {
            archivesName = "AnyoneVpn-${versionName}"
        }
    }

    compileOptions {
//        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig = true
    }

    viewBinding {
        enabled = true
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
        }
    }

    flavorDimensions "free"

    productFlavors {
        fullperm {
            dimension "free"
            applicationId 'io.anyone.anyonevpn'
            versionCode 17
            versionName getVersionName()
            base {
                archivesName = "AnyoneVpn-${versionName}"
            }
        }

        nightly {
            dimension "free"
            applicationId 'io.anyone.anyonevpn.nightly'
            versionName getVersionName()
            versionCode versionCodeEpoch()
            base {
                archivesName = "AnyoneVpn-${versionName}"
            }
        }
    }

    splits {
        abi {
            universalApk true
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version']
        }
    }

    ndkVersion = "29.0.14206865"
    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

    dependencies {
        implementation libs.kotlin.stdlib

        api libs.anon.android // project(':anon-android-binary')
        implementation files('../libs/geoip.jar')

        implementation libs.appcompat
        implementation libs.constraintlayout
        implementation libs.core.ktx
        implementation libs.localbroadcastmanager
        implementation libs.navigation.ui.ktx
        implementation libs.navigation.fragment.ktx
        implementation libs.preference.ktx
        implementation libs.work.runtime
        implementation libs.work.runtime.ktx

        implementation libs.android.shell

        implementation libs.material
        implementation libs.volley

        implementation libs.retrofit
        implementation libs.converter.gson

        //root detection
        implementation libs.rootbeer.lib

        testImplementation libs.junit
        androidTestImplementation libs.espresso.core
        androidTestImplementation libs.ext.junit
        androidTestImplementation libs.screengrab
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'InvalidPackage'
        htmlReport true
        lintConfig file('../lint.xml')
        textReport false
        xmlReport false
    }

    namespace 'io.anyone.anyonevpn'
}
